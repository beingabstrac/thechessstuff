name: Post Chess Reel to Buffer Queue

on:
  workflow_dispatch:
    inputs:
      fill_count:
        description: "How many reels to create and add to Buffer (default: 10)"
        required: false
        default: "10"
      puzzle_number:
        description: "Specific puzzle number to generate (e.g. 6 for #6, leave blank for auto queue)"
        required: false
        default: ""
  schedule:
    # Keeps Buffer topped up every 2 hours. Buffer decides actual publish times.
    - cron: "0 */2 * * *"

concurrency:
  group: post-to-buffer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      QUEUE_FILL_COUNT: ${{ github.event.inputs.fill_count || '10' }}
      TARGET_PUZZLE: ${{ github.event.inputs.puzzle_number }}
      IGNORE_QUEUE_FULL: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Render and Queue Loop
        run: |
          target="${TARGET_PUZZLE:-}"
          if [ -n "$target" ]; then
            echo "--- Generating Specific Requested Puzzle #$target ---"
            FORCE_PUZZLE="$target" ./scripts/render.sh
            python scripts/post_to_buffer.py
          else
            count="${QUEUE_FILL_COUNT:-10}"
            case "$count" in
              ''|*[!0-9]*) count=10 ;;
            esac
            if [ "$count" -lt 1 ]; then count=1; fi
            if [ "$count" -gt 10 ]; then count=10; fi
            for i in $(seq 1 "$count"); do
              echo "--- Rendering and Queueing Chess Reel $i of $count ---"
              ./scripts/render.sh
              python scripts/post_to_buffer.py
              if [ -f outputs/queue_full ]; then
                echo "Buffer queue is full (10 slots filled); stopping top-up loop."
                break
              fi
              python scripts/advance_progress.py
            done
          fi

      - name: Commit and Push Progress State
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]"
          git add data/progress.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: advance chess progress" && git push)
